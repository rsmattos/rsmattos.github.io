name: Build and Deploy Jekyll (Chirpy)

on:
  push:
    branches: [ main ]   # change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Ruby/Bundler with caching so builds are fast
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'        # or 3.2; GitHub’s runners have these
          bundler-cache: true

      # Install gems from Gemfile (github-pages or jekyll/minima/etc.)
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      # Build Jekyll into ./_site
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      # Upload the generated static site as the artifact for Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
